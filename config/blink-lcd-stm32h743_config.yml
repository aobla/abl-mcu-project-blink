# blink-led-stm32h743_config.yml
#
# Project configuration — single source of truth for build system.
# Copy this file and rename to <your-project>_config.yml for new projects.

project:
  name: blink-led-stm32h743
  description: "LED blink demo for stm32h743 board"
  version: "1.0.0"

hardware:
  board:
    name: devebox
    version: "1.0"
  mcu:
    family: stm32h7
    part: STM32H743VIT6
  # Path to platform hardware config (relative to project root)
  platform: config/platform/stm32h743_board.yml
  # Unique ID for PCB+MCU+firmware combination (optional)
  id: blink-led-v1-stm32h743vi

build:
  type: Debug               # default build type
  # output: blink-led-stm32h743 # firmware binary name (default = project.name)

# App-specific features (not shared across projects)
features:
  enable_log: true
  enable_cli: false
  enable_ota: false