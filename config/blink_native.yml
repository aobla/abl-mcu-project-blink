# App-конфиг (продукт) — blink на хосте (native, x86).
#
# Тот же src/, что и у микроконтроллерных продуктов: собирается под gcc хоста,
# GPIO эмулируется. Полезно для отладки логики и как «дымовой» прогон в CI.

product:
  id: blink-led-native
  description: "LED blink на хосте (симуляция GPIO)"
  version: "1.0.0"
  board: native_host
  runtime: bare

build:
  type: Debug

pins:
  led: { use: led0 }

features:
  enable_log: true
  enable_cli: false

params:
  blink_period_ms: 200
