platform: esp32
cpu: xtensa-lx6
frequencies:
  apb_freq: 80000000
  cpu_freq: 240000000
memory:
  flash: 4194304    # 4MB
  ram: 524288       # 512KB
features:
  enable_log: true
  enable_cli: false
  enable_ota: false
# ESP32 pin configuration
# For ESP32 there are no ports — port field holds the GPIO number
# pin field is set to 0 (unused, ESP32 HAL reads GPIO from port field)
pins:
  led:
    port: 2       # GPIO2 — встроенный светодиод на многих платах
    pin: 0
    mode: output
  uart_tx:
    port: 1       # GPIO1 — TX (UART0)
    pin: 0
    mode: alt_function
  uart_rx:
    port: 3       # GPIO3 — RX (UART0)
    pin: 0
    mode: alt_function
