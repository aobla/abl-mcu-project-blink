# stm32f103_board.yml
#
# Hardware configuration for STM32F103 platform.
# Shared across projects — do not put app-specific settings here.

platform: stm32f103
cpu: cortex-m3
frequencies:
  hclk: 72000000
  pclk1: 36000000
  pclk2: 72000000
memory:
  flash: 32768      # 32KB (C6 variant)
  ram: 10240        # 10KB
pins:
  led:
    port: GPIOC
    pin: 13
    mode: output
    state: low
  uart_tx:
    port: GPIOA
    pin: 9
    mode: alt_function
  uart_rx:
    port: GPIOA
    pin: 10
    mode: alt_function
