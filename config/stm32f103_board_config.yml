platform: stm32f103
cpu: cortex-m3
frequencies:
  hclk: 72000000
  pclk1: 36000000
  pclk2: 72000000
memory:
  flash: 131072     # 128KB
  ram: 20480        # 20KB
features:
  enable_log: true
  enable_cli: false
  enable_ota: false
pins:
  led:
    port: GPIOC
    pin: 13
    mode: output
  uart_tx:
    port: GPIOA
    pin: 9
    mode: alt_function
  uart_rx:
    port: GPIOA
    pin: 10
    mode: alt_function