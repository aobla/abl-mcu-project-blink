# Prerequisites for ABL MCU Project Blink — bootstrap проекта.
#
# Здесь ТОЛЬКО то, что нужно, чтобы получить рабочее окружение с нуля:
#   - системные инструменты сборки и pip-пакеты;
#   - репозиторий платформы (откуда берётся всё остальное).
#
# Версии vendor-SDK и кросс-тулчейнов живут в МАНИФЕСТЕ ПЛАТФОРМЫ:
#   <platform>/manifest.yml   (канонический источник, D2 / ARCHITECTURE §5)
# setup.sh читает его автоматически после клонирования платформы.
#
# Resolution order:
#   1. ABL_DEPS_PATH env var → $ABL_DEPS_PATH/<name>/
#   2. project/lib/<name>/
#   3. ~/.local/share/abl-mcu-deps/<name>/

# ─── Common build tools ──────────────────────────────────────────────────────
common:
  - name: cmake
    check:
      binary: cmake
      version_flag: "--version"
      version_regex: "cmake version ([0-9]+\\.[0-9]+)"
      min_version: "3.20"
    packages:
      debian: cmake
      ubuntu: cmake
      arch: cmake
      fedora: cmake
      macos: cmake

  - name: ninja
    check:
      binary: ninja
      version_flag: "--version"
      version_regex: "([0-9]+\\.[0-9]+\\.[0-9]+)"
      min_version: "1.10"
    packages:
      debian: ninja-build
      ubuntu: ninja-build
      arch: ninja
      fedora: ninja-build
      macos: ninja

  - name: python3
    check:
      binary: python3
      version_flag: "--version"
      version_regex: "Python ([0-9]+\\.[0-9]+)"
      min_version: "3.8"
    packages:
      debian: python3 python3-pip
      ubuntu: python3 python3-pip
      arch: python python-pip
      fedora: python3 python3-pip
      macos: python

  - name: pip_packages
    python:
      - pyyaml>=5.4.0
      - jinja2>=3.0.0

  - name: git
    check:
      binary: git
      version_flag: "--version"
      version_regex: "git version ([0-9]+\\.[0-9]+\\.[0-9]+)"
      min_version: "2.20"
    packages:
      debian: git
      ubuntu: git
      arch: git
      fedora: git
      macos: git

  - name: curl
    check:
      binary: curl
      version_flag: "--version"
      version_regex: "curl ([0-9]+\\.[0-9]+\\.[0-9]+)"
      min_version: "7.0"
    packages:
      debian: curl
      ubuntu: curl
      arch: curl
      fedora: curl
      macos: curl

# ─── Git dependencies (платформа: core/drivers/system теперь в одном репо) ────
# Downloaded to lib/<dest>/ in project directory by default.
dependencies:
  platform-core:
    git:
      url: "https://github.com/aobla/abl-mcu-platform.git"
      tag: "dev"
    dest: "lib/abl-mcu-platform"
    required: true
